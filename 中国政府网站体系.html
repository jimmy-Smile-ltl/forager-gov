<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>中国政府网站体系</title>
<style>
:root{
  --ground:#f5f6f2; --surface:#ffffff; --surface2:#eef0ea;
  --ink:#212529; --muted:#6e757c; --faint:#9aa0a6;
  --line:#e4e7e0; --line2:#d6dad1;
  --accent:#b23a2e; --accent-soft:#f6e8e5;
  --ok:#2f7d4f; --ok-bg:#e7f2ea;
  --warn:#a97b22; --warn-bg:#f6efdf;
  --missing:#9aa0a6; --missing-bg:#eff0ee;
  --chip-ink:#3a4a5c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#16191e; --surface:#1d2127; --surface2:#232830;
    --ink:#e8eaed; --muted:#98a1ab; --faint:#6d7680;
    --line:#2b3037; --line2:#353b43;
    --accent:#d4654f; --accent-soft:#3a2622;
    --ok:#4c9a6a; --ok-bg:#20302a;
    --warn:#c9a04a; --warn-bg:#332b1d;
    --missing:#5e6670; --missing-bg:#242830;
    --chip-ink:#b9c4d0;
  }
}
:root[data-theme="dark"]{
  --ground:#16191e; --surface:#1d2127; --surface2:#232830;
  --ink:#e8eaed; --muted:#98a1ab; --faint:#6d7680;
  --line:#2b3037; --line2:#353b43;
  --accent:#d4654f; --accent-soft:#3a2622;
  --ok:#4c9a6a; --ok-bg:#20302a;
  --warn:#c9a04a; --warn-bg:#332b1d;
  --missing:#5e6670; --missing-bg:#242830;
  --chip-ink:#b9c4d0;
}
*{box-sizing:border-box}
html,:root{--dotcol:#c8c2b4;--sel:#f1c40f}
body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  display:flex; flex-direction:column; height:100vh; overflow:hidden;
}
a{color:inherit}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; padding:0}
input{font:inherit; color:inherit}

/* ---------- 顶栏 ---------- */
header{
  display:flex; align-items:center; gap:10px 16px; flex-wrap:wrap;
  padding:8px 22px 10px; border-bottom:1px solid var(--line); background:var(--surface);
}
.seal{
  width:46px; height:46px; flex:none; background:var(--accent); color:#fff;
  display:grid; place-items:center; border-radius:4px;
  font-family:"Songti SC","STSong","SimSun",serif; font-size:20px;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.18);
}
h1{
  margin:0; font-family:"Songti SC","STSong","SimSun",serif;
  font-size:21px; font-weight:700; letter-spacing:.5px; text-wrap:balance;
}
.sub{color:var(--muted); font-size:12.5px; margin-top:1px}
.stats{display:flex; gap:8px; flex:1 1 100%; margin-left:0; flex-wrap:nowrap}
.stat{
  display:flex; flex-direction:column; align-items:center; flex:1;
  padding:5px 8px; border:1px solid var(--line); border-radius:8px;
  background:var(--surface); min-width:64px; cursor:pointer;
  text-align:center; font-variant-numeric:tabular-nums;
}
.stat:hover{border-color:var(--line2); background:var(--surface2)}
.stat b{font-size:15px; font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap}
.stat span{font-size:10.5px; color:var(--muted)}
.stat .hit{color:var(--ok)} .stat .miss{color:var(--warn)}

/* ---------- 工具栏 ---------- */
.toolbar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:8px 22px; border-bottom:1px solid var(--line); background:var(--surface);
}
.search{
  flex:0 1 400px; max-width:100%; display:flex; align-items:center; gap:8px;
  border:1px solid var(--line2); border-radius:8px; padding:7px 12px; background:var(--surface2);
}
.search:focus-within{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
.search input{border:none; outline:none; background:none; width:100%; font-size:13.5px}
.viewswitch{display:flex; gap:0; border:1px solid var(--line2); border-radius:8px; overflow:hidden; flex:none}
.viewbtn{border:none; border-radius:0; padding:7px 14px; background:var(--surface2); color:var(--muted)}
.viewbtn.active{background:var(--accent); color:#fff; font-weight:600}
.crossbox{margin:8px 0; padding:8px 10px; border:1px dashed var(--line2); border-radius:8px; background:var(--surface2); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.crossbtn{font-size:12.5px; padding:5px 12px}
.crossnote{font-size:11.5px; color:var(--faint)}
.filterrow{
  display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px;
  padding:8px 22px; border-bottom:1px solid var(--line); background:var(--surface);
}
.flabel{font-size:12px; color:var(--muted); flex:none}
.farrow{font-size:10px}
.search .clear{display:none; border:none; background:none; color:var(--faint); font-size:17px; cursor:pointer; padding:0 6px; line-height:1}
.search.has-text .clear{display:block}
.search .count{font-size:11.5px; color:var(--muted); border-left:1px solid var(--line2); padding-left:10px; white-space:nowrap; font-variant-numeric:tabular-nums}
.hshu{font-size:10px; margin-left:6px; padding:1px 6px; border-radius:99px; background:var(--warn-bg,#f6efdf); color:var(--warn,#a97b22); border:1px solid color-mix(in srgb,var(--warn,#a97b22) 40%,transparent); white-space:nowrap}
.dtag{font-size:10px; margin-left:6px; padding:1px 6px; border-radius:99px; background:color-mix(in srgb,var(--line,#d8dbe2) 45%,transparent); color:var(--muted,#6b7280); border:1px solid color-mix(in srgb,var(--muted,#6b7280) 25%,transparent); white-space:nowrap}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  border:1px solid var(--line2); border-radius:999px; padding:4px 12px;
  font-size:12.5px; color:var(--muted); background:var(--surface);
}
.chip:hover{background:var(--surface2)}
.chip.on{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.btn{
  border:1px solid var(--line2); border-radius:8px; padding:6px 12px; font-size:12.5px;
  color:var(--muted); background:var(--surface);
}
.btn:hover{background:var(--surface2); color:var(--ink)}

/* ---------- 主体 ---------- */
main{flex:1; display:flex; min-height:0}
.treepane{
  flex:1 1 55%; min-width:0; overflow-y:auto; padding:12px 8px 40px 18px;
}
.detailpane{
  flex:0 0 42%; max-width:640px; overflow-y:auto;
  border-left:1px solid var(--line); background:var(--surface); padding:20px 22px;
}
/* ---------- 机构档案卡（树图/地图右侧详情） ---------- */
.detailpane .vsd{position:relative}
.detailpane .vsd-x{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:11px;
  cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2}
.detailpane .vsd-x:hover{color:var(--ink);border-color:var(--accent,#7c4dff)}
.detailpane .vsd-badge{display:inline-block;padding:2.5px 10px;border-radius:99px;font-size:10.5px;
  color:#fff;letter-spacing:.06em;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.detailpane .vsd-n{font-size:16px;font-weight:700;margin:9px 0 9px;line-height:1.4;word-break:break-all;color:var(--ink)}
.detailpane .vsd-rows{border-top:1px solid var(--line);padding-top:8px}
.detailpane .vsd-row{display:flex;gap:8px;margin:6px 0;font-size:12.5px;color:var(--ink);align-items:baseline}
.detailpane .vsd-k{color:var(--muted);min-width:38px;flex:none;font-size:11.5px}
.detailpane .vsd-urlv{color:var(--accent,#7c4dff);word-break:break-all;flex:1;min-width:0}
.detailpane .vsd-urlv a{color:var(--accent,#7c4dff);text-decoration:none;border-bottom:1px dashed color-mix(in srgb,var(--accent,#7c4dff) 45%,transparent)}
.detailpane .vsd-urlv a:hover{border-bottom-style:solid}
.detailpane .vsd-none{color:var(--muted)}
.detailpane .vsd-barcell{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.detailpane .vsd-bar{flex:1;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.detailpane .vsd-bar i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
.detailpane .vsd-bar~em{font-style:normal;font-size:11px;color:var(--muted);flex:none}
.detailpane .vsd-note{margin:9px 0 2px;padding:9px 11px;border-left:3px solid var(--accent,#7c4dff);
  background:color-mix(in srgb,var(--accent,#7c4dff) 7%,transparent);border-radius:0 8px 8px 0;
  font-size:11.8px;color:var(--ink);line-height:1.6}
.detailpane .vsd-urls{display:flex;flex-direction:column;gap:5px;margin:4px 0 6px}
.detailpane .vsd-ur{display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.detailpane .vsd-dot{width:7px;height:7px;border-radius:50%;flex:none}
.detailpane .vsd-ur b{font-weight:500;color:var(--muted);min-width:38px;text-align:left;flex:none;font-size:11.5px}
.detailpane .vsd-ur a{color:var(--accent,#7c4dff);word-break:break-all;flex:1;min-width:0;text-decoration:none}
.detailpane .vsd-ur .no{color:var(--muted)}
.detailpane .vsd-btns{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.detailpane .vsd-btn{flex:1 1 auto;padding:7px 10px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface2);color:var(--ink);font-size:12px;cursor:pointer;text-align:center;white-space:nowrap}
.detailpane .vsd-btn:hover{border-color:var(--accent,#7c4dff)}
.detailpane .vsd-btn.vsd-pri{background:var(--accent,#7c4dff);border-color:var(--accent,#7c4dff);color:#fff;font-weight:600}
.detailpane .vsd-btn.vsd-pri:hover{filter:brightness(1.1)}

/* ---------- 树 ---------- */
.tree details{display:block}
.tree summary{
  list-style:none; display:flex; align-items:center; gap:7px;
  padding:3px 6px; border-radius:6px; cursor:pointer; user-select:none;
  min-height:28px;
}
.tree summary::-webkit-details-marker{display:none}
.tree summary:hover{background:var(--surface2)}
.tree summary:focus-visible{outline:2px solid var(--accent); outline-offset:-1px}
.tree summary .tw{
  width:14px; flex:none; text-align:center; color:var(--faint); font-size:10px;
  transition:transform .12s ease;
}
.tree details[open]>summary .tw{transform:rotate(90deg)}
.dot{width:8px; height:8px; border-radius:50%; flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.missing{background:var(--missing)}
.tree .name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tree .name mark{background:var(--accent-soft); color:var(--accent); border-radius:3px; padding:0 1px}
.lv{
  flex:none; font-size:10.5px; padding:1px 6px; border-radius:4px;
  background:var(--surface2); color:var(--chip-ink); border:1px solid var(--line);
  font-variant-numeric:tabular-nums;
}
.cnt{flex:none; font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums; white-space:nowrap}
.cnt .g{color:var(--ok)}
.cd{
  flex:none; margin-left:auto; font-size:10px; color:var(--faint);
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-variant-numeric:tabular-nums; letter-spacing:.2px;
}
.grprow .name{font-weight:600}
.children{margin-left:20px; border-left:1px solid var(--line); padding-left:4px}
.hint{color:var(--faint); font-size:12px; padding:6px 8px}

/* 结果列表模式 */
.reslist{padding:6px 2px}
.resrow{
  display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:6px; cursor:pointer;
}
.resrow:hover{background:var(--surface2)}
.resrow.sel{background:var(--accent-soft)}
.resrow .path{color:var(--faint); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:36%; flex:none}
.resrow .name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.resmore{padding:10px 8px; color:var(--muted); font-size:12.5px}
.resgroup{
  font-size:12px; font-weight:600; color:var(--muted); padding:9px 8px 3px; margin-top:6px;
  border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--ground); z-index:2;
}
.locatebtn{flex:none; font-size:11px; color:var(--accent); border:1px solid var(--line2); border-radius:5px; padding:1px 8px; opacity:0; transition:opacity .12s; white-space:nowrap}
.resrow:hover .locatebtn{opacity:1}
.resrow.sel .locatebtn{opacity:1}
.flash{animation:flashbg 1.8s ease}
@keyframes flashbg{0%,40%{background:var(--accent-soft)}100%{background:transparent}}
.navhint{font-size:11.5px; color:var(--faint); padding:2px 8px 6px}
.empty{padding:24px 8px; color:var(--faint); font-size:13px; text-align:center}

/* ---------- 详情 ---------- */
.detail .dtitle{
  font-family:"Songti SC","STSong","SimSun",serif; font-size:19px; font-weight:700;
  margin:0 0 2px; text-wrap:balance;
}
.crumb{color:var(--faint); font-size:12px; margin:0 0 14px}
.dchips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px}
.dchip{
  font-size:12px; padding:2px 9px; border-radius:5px;
  background:var(--surface2); border:1px solid var(--line); color:var(--chip-ink);
}
.dchip.st-ok{background:var(--ok-bg); color:var(--ok); border-color:transparent}
.dchip.st-warn{background:var(--warn-bg); color:var(--warn); border-color:transparent}
.dchip.st-missing{background:var(--missing-bg); color:var(--missing); border-color:transparent}
.dsection{margin-bottom:18px}
.dlabel{
  font-size:11.5px; letter-spacing:.08em; color:var(--muted); text-transform:uppercase;
  margin:0 0 6px;
}
.durl{
  display:flex; align-items:center; gap:8px; margin-bottom:8px;
}
.durl a{
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:12.5px;
  color:var(--accent); word-break:break-all; text-decoration:none; border-bottom:1px dashed var(--line2);
}
.durl a:hover{border-bottom-style:solid}
.copybtn{
  flex:none; font-size:11.5px; color:var(--muted); border:1px solid var(--line2);
  border-radius:5px; padding:2px 8px;
}
.copybtn:hover{color:var(--ink); background:var(--surface2)}
.dtext{font-size:13px; color:var(--muted); margin:0}
.dgroup-stats{display:flex; gap:10px; flex-wrap:wrap}
.gstat{flex:1 1 120px; border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--surface)}
.gstat b{display:block; font-size:18px; font-variant-numeric:tabular-nums}
.gstat span{font-size:11.5px; color:var(--muted)}

/* ---------- 提取规则（详情面板内子视图） ---------- */
.rulebox{border:1px solid var(--line2); border-radius:10px; padding:14px 16px; background:var(--surface)}
.rulebox .rmethod{font-size:13px; margin:6px 0 10px}
.rulemeta{display:flex; flex-direction:column; gap:10px; margin-bottom:16px}
.rulemeta .rlabel{font-size:11.5px; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; margin:0}
.rulemeta a{color:var(--accent); font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:12.5px; word-break:break-all}
.codewrap{position:relative; border:1px solid var(--line2); border-radius:10px; overflow:hidden; margin-bottom:16px}
.codewrap .bar{
  display:flex; align-items:center; justify-content:space-between;
  padding:6px 12px; background:var(--surface2); border-bottom:1px solid var(--line);
  font-size:12px; color:var(--muted);
}
.codewrap pre{
  margin:0; padding:14px 16px; max-height:420px; overflow:auto;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:12px; line-height:1.55;
  color:var(--ink); background:var(--surface); white-space:pre;
}
.samptable{width:100%; border-collapse:collapse; font-size:12.5px}
.samptable th{text-align:left; font-weight:600; color:var(--muted); border-bottom:1px solid var(--line); padding:5px 8px; font-size:11.5px}
.samptable td{padding:4px 8px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums}
.samptable td.url{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:11.5px; word-break:break-all; color:var(--muted)}
.sampcity{display:flex; flex-wrap:wrap; gap:6px}
.sampcity a{border:1px solid var(--line2); border-radius:6px; padding:3px 10px; font-size:12px; color:var(--ink); text-decoration:none}
.sampcity a:hover{background:var(--surface2)}
.sampdept{width:100%; border-collapse:collapse; font-size:12.5px; cursor:pointer}
.sampdept td{padding:4px 8px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums}
.sampdept tr:hover td{background:var(--surface2)}
.sampdept td.url{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:11.5px; word-break:break-all; color:var(--muted)}
.backbtn{font-size:12px; color:var(--accent); border:1px solid var(--line2); border-radius:6px; padding:3px 12px; margin-bottom:12px}
.backbtn:hover{background:var(--accent-soft)}
/* 详情选项卡 */
.dtabs{display:flex; gap:6px; margin-bottom:14px; border-bottom:1px solid var(--line); padding-bottom:8px}
.dtab{
  display:flex; align-items:center; gap:5px; font-size:13px; padding:4px 12px;
  border-radius:6px; color:var(--muted);
}
.dtab:hover{background:var(--surface2)}
.dtab.on{background:var(--ink); color:var(--surface)}
.hintbtn{
  width:15px; height:15px; border-radius:50%; border:1px solid var(--line2);
  font-size:10px; color:var(--muted); display:inline-flex; align-items:center; justify-content:center;
  line-height:1;
}
.dtab.on .hintbtn{border-color:var(--surface); color:var(--surface)}
.hintpop{
  position:fixed; max-width:320px; background:var(--surface); border:1px solid var(--line2);
  border-radius:8px; padding:10px 12px; font-size:12px; color:var(--ink); line-height:1.6;
  box-shadow:0 4px 16px rgba(0,0,0,.14); z-index:60;
}
/* JSON 树查看器 */
.jsonbox{border:1px solid var(--line2); border-radius:10px; overflow:hidden; margin-top:8px}
.jsonbox .jbar{display:flex; align-items:center; justify-content:space-between; padding:6px 12px; background:var(--surface2); border-bottom:1px solid var(--line); font-size:12px; color:var(--muted)}
.jstats{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 4px}
.jstat{flex:1 1 90px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--surface)}
.jstat b{display:block; font-size:16px; font-variant-numeric:tabular-nums}
.jstat span{font-size:11px; color:var(--muted)}
.jtree{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:12px; line-height:1.7; padding:8px 12px; overflow:auto; max-height:560px}
.jnode details{display:block}
.jnode summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:6px; padding:1px 4px; border-radius:4px}
.jnode summary::-webkit-details-marker{display:none}
.jnode summary:hover{background:var(--surface2)}
.jnode summary .tw{width:12px; flex:none; color:var(--faint); font-size:9px; transition:transform .12s}
.jnode details[open]>summary .tw{transform:rotate(90deg)}
.jnode .children{margin-left:18px; border-left:1px dashed var(--line2); padding-left:6px}
.jkey{color:var(--accent)}
.jt{color:var(--faint); font-size:10.5px}
.jcnt{color:var(--muted); font-size:10.5px; background:var(--surface2); border-radius:4px; padding:0 5px}
.jstr{color:var(--ok)}
.jcom{color:var(--faint); font-style:italic}
.jkwd{color:#7a4ea3; font-weight:600}
.jdef{color:var(--accent); font-weight:700}
.jbuilt{color:#0f7b8a}
.jdec{color:var(--accent)}
.jnum{color:#2a6db5}
.jbool{color:#7a4ea3}
.jnull{color:var(--faint); font-style:italic}
.jrow{display:flex; gap:6px; padding:1px 4px}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .jnum{color:#6aa7e8}
  :root:not([data-theme="light"]) .jbool{color:#b78ce0}
}
:root[data-theme="dark"] .jnum{color:#6aa7e8}
:root[data-theme="dark"] .jbool{color:#b78ce0}
:root[data-theme="dark"] .jkwd{color:#b78ce0}
:root[data-theme="dark"] .jbuilt{color:#4fb8c6}

footer{padding:8px 22px; border-top:1px solid var(--line); font-size:11.5px; color:var(--faint); background:var(--surface); display:flex; gap:14px; flex-wrap:wrap}
@media (max-width:900px){
  main{flex-direction:column}

<script src="data_js/manifest.js?v=20261113"></script>
<script>
// 大一统: 列表/树图/地图共用 __GOV_DATA__（块树+条树合并; 无 file 字段,
// 原 ensureModule 惰性加载逻辑自动跳过）
const DATA=(window.__GOV_DATA__&&window.__GOV_DATA__.block)?{
  n:"中国政府网站体系", l:"根", k:"分组", c:"",
  ks:[...window.__GOV_DATA__.block.ks, window.__GOV_DATA__.tiao]
}:window.__MANIFEST__.root;
let viewMode="块";   // 块=行政层级（默认）；条=垂直管理系统
const TIAO_ROOT_NAME="条（垂直管理系统）";
const TIAO_SYS=["海关系统","税务系统","邮政系统","烟草系统","人民银行系统","铁路系统","金融监管系统","证监会系统","移民管理系统","自然资源督察系统","法院系统","检察院系统","人大系统","政协系统"];
const CROSS_MAP={   // 块视图节点 → 条视图系统组
  "海关总署":"海关系统（42）",
  "国家税务总局":"税务系统（31）",
  "国家邮政局":"邮政系统（29）",
  "国家烟草专卖局":"烟草系统（5）",
  "中国人民银行":"人民银行系统（33）",
  "国家铁路局":"铁路系统（6）",
  "国家金融监督管理总局":"金融监管系统（38）",
  "中国证券监督管理委员会":"证监会系统（39）",
  "国家移民管理局":"移民管理系统（32）",
  "自然资源部":"自然资源督察系统（10）",
  "最高人民法院":"法院系统（34）",
  "最高人民检察院":"检察院系统（33）",
  "全国人民代表大会（全国人大常委会）":"人大系统（33）",
  "中国人民政治协商会议全国委员会":"政协系统（33）",
  "中华全国总工会":"工会系统（中华全国总工会）"
};
const REVERSE_MAP={}; Object.entries(CROSS_MAP).forEach(([k,v])=>{REVERSE_MAP[v]=k;});
const MANIFEST=window.__MANIFEST__;
const BASE=new URL(".", document.baseURI).href;

/* ---------- 数据工具 ---------- */
const LEVELS=["中央","省","市","地级区","县","特别行政区","港澳台"];
const LEVEL_LABELS={中央:"中央",省:"省级",市:"市级",地级区:"地级区",县:"县级",特别行政区:"特别行政区",港澳台:"港澳台下级"};
function statusOf(n){
  // 部门名录叶子（k=部门，市政府部门/县政府部门两个专题节点下）：有栏目链接即
  // 视为已收录。它们没有「政府信息公开专栏」概念，走门户口径会 6.5 万条全变黄
  // 「待核」，分组行也会显示「N 单位 · 0 已收录」（2026-11-19 列表巡检修复）
  if(n.k==="部门") return n.u?"ok":"missing";
  if(n.x) return "ok";
  if(n.u) return "warn";
  return "missing";
}
function hasKids(n){ return !!n.ks; }
function isEntity(n){ return !n.ks || n.k!=="分组"; }

/* ---------- 模块化加载器 ---------- */
const loadedMods=new Set();
const loadPromises={};
function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=BASE+"data_js/"+src; s.onload=res; s.onerror=()=>rej(new Error("加载失败 "+src));
    document.head.append(s);
  });
}
async function ensureModule(key){
  if(loadedMods.has(key)) return;
  if(!loadPromises[key]) loadPromises[key]=loadScript(MANIFEST.modules[key]).then(()=>{
    loadedMods.add(key);
  });
  await loadPromises[key];
}
async function ensureRule(pname){
  const f=MANIFEST.rulesFiles[pname];
  if(!f) return null;
  if(!window.__R || !window.__R[pname]){
    await loadScript(f);
  }
  return window.__R[pname];
}
/* 把模块内容合并进桩节点 */
function registerParents(n,parent){
  if(parent!==null) parents.set(n,parent);
  (n.ks||[]).forEach(c=>registerParents(c,n));
}
function attachModule(stub){
  if(stub.__loaded || !stub.file) return;
  const key=stub._key;
  const m=window.__M[key];
  if(m){
    stub.ks=m.ks;
    stub.__loaded=true;
    registerParents(stub, parents.get(stub)||null);
  }
}
async function loadAll(){
  await Promise.all(Object.keys(MANIFEST.modules).map(ensureModule));
  attachAll();
  buildIndex();
}
function attachAll(){
  const attach=(n)=>{
    if(n.file && !n.__loaded) attachModule(n);
    (n.ks||[]).forEach(attach);
  };
  attach(DATA);
}

/* ---------- 搜索索引 ---------- */
const pathIndex=new Map();
const parents=new Map();
let indexReady=false;
function buildIndex(){
  pathIndex.clear(); parents.clear();
  const walkPath=(n,accAll,accEnt,parent)=>{
    if(parent!==null) parents.set(n,parent);
    const all=[...accAll,n.n].join("");
    const ent=n.k==="分组"?[...accEnt]:[...accEnt,n.n];
    if(isEntity(n)) pathIndex.set(n,{all, ent:ent.join("")});
    (n.ks||[]).forEach(c=>walkPath(c,[...accAll,n.n],ent,n));
  };
  walkPath(DATA,[],[],null);
  indexReady=true;
}
function tokenize(q){ return q.trim().toLowerCase().split(/\s+/).filter(Boolean); }
let hlRe=null;
function buildHl(){
  const toks=tokenize(filter.q);
  hlRe = toks.length
    ? new RegExp("("+toks.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi")
    : null;
}
function matches(n,tokens){
  if(!tokens.length) return true;
  const name=n.n.toLowerCase();
  const idx=pathIndex.get(n)||{all:"",ent:""};
  const flat=((idx.all+idx.ent)+(n.cd||"")).toLowerCase();
  return tokens.every(t=> name.includes(t)||flat.includes(t));
}
function breadcrumb(n){
  const chain=[]; let p=parents.get(n);
  while(p){ chain.unshift(p.n); p=parents.get(p); }
  chain.push(n.n);
  return chain.join(" › ");
}

/* ---------- 转义/高亮 ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function hl(s){
  const safe=esc(s);
  if(!hlRe) return safe;
  return safe.split(hlRe).map((part,i)=>i%2===1?`<mark>${part}</mark>`:part).join("");
}

/* ---------- 树渲染（惰性） ---------- */
const pane=document.getElementById("treepane");
const listBox=document.getElementById("treeList");
const vizBox=document.getElementById("treeViz");
const vizWrap=document.getElementById("treeVizWrap");
let dispMode="list";   // list=树行列表 | viz=思维导图树图
let filter={q:"", levels:new Set(LEVELS), status:new Set(["ok","warn","missing"])};
let selectedNode=null;

function statsOf(n){
  const s={e:0,ok:0,warn:0,miss:0};
  (function acc(x){
    if(x.file && !x.__loaded){
      const st=x._stats||{e:0,ok:0,warn:0,miss:0};
      s.e+=st.e; s.ok+=st.ok; s.warn+=st.warn; s.miss+=st.miss;
      return;
    }
    if(isEntity(x)){ s.e++; const t=statusOf(x); if(t==="ok")s.ok++; else if(t==="warn")s.warn++; else s.miss++; }
    (x.ks||[]).forEach(acc);
  })(n);
  return s;
}
function totalStats(){
  return {all:MANIFEST.total.e, allok:MANIFEST.total.ok, per:MANIFEST.perLevel};
}

function nodeRow(n, depth, opts={}){
  const expandable=hasKids(n)||(n.file&&!n.__loaded);
  const st=statusOf(n);
  const nameEl=document.createElement("span");
  nameEl.className="name";
  nameEl.innerHTML=hl(n.n);
  // 2026-11-16 合署办公特别标注（列表模式徽章, 与树图/地图一致）
  if(n.m&&/合署|区政合一|镜像/.test(n.m)){
    const hb=document.createElement("span");
    hb.className="hshu";
    hb.textContent="🤝合署";
    hb.title=n.m;
    nameEl.appendChild(hb);
  }
  // 2026-11-19：县级「组织机构」页里混有乡镇（街道）与党委机构，节点名统一是
  // 「XX局」，不加标注会被误读为县政府部门。dt 由 p250 归类带出。
  if(n.k==="部门"&&(n.dt==="town"||n.dt==="party")){
    const tg=document.createElement("span");
    tg.className="dtag";
    tg.textContent=n.dt==="town"?"乡镇/街道":"党委机构";
    nameEl.appendChild(tg);
  }
  const cntEl=document.createElement("span");
  cntEl.className="cnt";
  if(expandable){
    const s=statsOf(n);
    cntEl.innerHTML=`${s.e} 单位 · <span class="g">${s.ok}</span> 已收录`;
  }
  const dot=document.createElement("span"); dot.className="dot "+st; dot.title=st;
  const lv=document.createElement("span"); lv.className="lv"; lv.textContent=n.l;
  if(expandable){
    const sum=document.createElement("summary");
    sum.tabIndex=0;
    const tw=document.createElement("span"); tw.className="tw"; tw.textContent="▶";
    sum.append(tw,dot,nameEl,lv,cntEl);
    if(n.cd){
      const cd=document.createElement("span"); cd.className="cd"; cd.textContent=n.cd;
      sum.append(cd);
    }
    sum.addEventListener("click",()=>{ select(n,sum); });
    const det=document.createElement("details");
    det.className="grprow";
    det.append(sum);
    if(opts.open===true) det.open=true;
    const kidsBox=document.createElement("div");
    kidsBox.className="children";
    let rendered=false;
    det.append(kidsBox);
    const renderKids=()=>{
      if(rendered) return;
      if(n.file && !n.__loaded){
        kidsBox.innerHTML='<div class="hint">数据加载中…</div>';
        const key=n._key;
        ensureModule(key).then(()=>{
          attachModule(n);
          if(!rendered){
            rendered=true;
            kidsBox.innerHTML="";
            const kids=(n.ks||[]).filter(visible);
            kids.forEach(k=>kidsBox.append(nodeRow(k,depth+1)));
            if(!kids.length) kidsBox.innerHTML='<div class="hint">无符合筛选的条目</div>';
          }
        });
        return;
      }
      rendered=true;
      const kids=(n.ks||[]).filter(visible);
      kids.forEach(k=>kidsBox.append(nodeRow(k,depth+1)));
      if(!kids.length) kidsBox.innerHTML='<div class="hint">无符合筛选的条目</div>';
    };
    det.addEventListener("toggle",()=>{ if(det.open) renderKids(); });
    if(det.open) renderKids();
    n.__det=det; n.__sum=sum;
    return det;
  }
  const row=document.createElement("div");
  row.className="resrow";
  row.tabIndex=0;
  const spacer=document.createElement("span"); spacer.className="tw"; spacer.style.visibility="hidden";
  spacer.textContent="▶";
  row.append(spacer,dot,nameEl,lv);
  if(n.cd){
    const cd=document.createElement("span"); cd.className="cd"; cd.textContent=n.cd;
    row.append(cd);
  }
  row.addEventListener("click",()=>select(n,row));
  row.addEventListener("keydown",(e)=>{ if(e.key==="Enter") select(n,row); });
  n.__el=row;
  return row;
}
function visible(n){
  if(hasKids(n)&&!isEntity(n)) return true;
  if(!filter.levels.has(n.l)) return false;
  if(!filter.status.has(statusOf(n))) return false;
  return true;
}
async function renderTree(){
  listBox.innerHTML="";
  document.getElementById("resCount").textContent="";
  window.__resRows=[]; window.__selIdx=-1;
  const wrap=document.createElement("div");
  wrap.className="tree";
  let roots;
  if(viewMode==="条"){
    const stub=DATA.ks.find(g=>g.n===TIAO_ROOT_NAME);
    if(stub){
      if(stub.file&&!stub.__loaded){
        await ensureModule(stub._key);
        attachModule(stub);
      }
      roots=stub.ks||[];
    }else roots=[];
  }else{
    roots=DATA.ks.filter(g=>g.n!==TIAO_ROOT_NAME);
  }
  const kids=roots.filter(visible);
  kids.forEach(k=>wrap.append(nodeRow(k,0,{open:viewMode==="条"
    ? k===roots[0] : k.n.startsWith("中央")})));
  listBox.append(wrap);
}
function expandAll(){
  document.querySelectorAll(".tree details").forEach(d=>{ d.open=true; });
  document.querySelectorAll(".tree details").forEach(d=>d.dispatchEvent(new Event("toggle")));
}
function collapseAll(){
  document.querySelectorAll(".tree details").forEach(d=>{ d.open=false; });
}

/* ---------- 结果列表（搜索/筛选模式） ---------- */
function listMode(){
  return filter.q.trim()!=="" || filter.levels.size<LEVELS.length || filter.status.size<3;
}
async function renderList(){
  if(viewMode==="条"){   // 条模式先加载条模块（惰性）
    const stub=DATA.ks.find(g=>g.n===TIAO_ROOT_NAME);
    if(stub&&stub.file&&!stub.__loaded){
      await ensureModule(stub._key);
      attachModule(stub);
      if(!indexReady) buildIndex();
    }
  }
  const tokens=tokenize(filter.q);
  const out=[];
  (function walkEnt(n){
    if(isEntity(n)){
      if(filter.levels.has(n.l)&&filter.status.has(statusOf(n))&&matches(n,tokens)) out.push(n);
    }
    (n.ks||[]).forEach(walkEnt);
  })(DATA);
  listBox.innerHTML="";
  const countEl=document.getElementById("resCount");
  countEl.textContent=out.length? `${out.length} 条` : "";
  const box=document.createElement("div");
  box.className="reslist";
  if(!out.length){
    box.innerHTML=`<div class="empty">没有符合条件的结果<br><span style="font-size:12px">试试：缩短关键词 / 检查层级与状态筛选 / 空格分词（如「四川 商务厅」）</span></div>`;
  }else{

/* 树内定位：清空检索 → 展开祖先链 → 滚动高亮 */
async function locateInTree(n){
  qInput.value=""; filter.q=""; hlRe=null;
  document.getElementById("searchBox").classList.remove("has-text");
  document.getElementById("resCount").textContent="";
  filter.levels=new Set(LEVELS); filter.status=new Set(["ok","warn","missing"]);
  syncChips();
  await renderTree();
  const chain=[]; let p=parents.get(n);
  while(p && p!==DATA){ chain.unshift(p); p=parents.get(p); }
  chain.forEach(a=>{
    const det=a.__det;
    if(det && !det.open){
      det.open=true;
      det.dispatchEvent(new Event("toggle"));
    }
  });
  if(n.__det && !n.__det.open){
    n.__det.open=true;
    n.__det.dispatchEvent(new Event("toggle"));
  }
  const el=n.__el||n.__sum;
  if(el){
    el.scrollIntoView({block:"center"});
    el.classList.add("flash");
    setTimeout(()=>el.classList.remove("flash"),2000);
    select(n,el);
  }
}

async function locateByName(provName, targetName){
  if(MANIFEST.modules[provName]) await ensureModule(provName);

  (function find(n){
    if(n.n===targetName && isEntity(n)){ found=n; return; }
    (n.ks||[]).forEach(find);
    if(found) return;
  })(DATA);
  if(found) locateInTree(found);
}

function ruleKeyOf(n){
  if(n.n==="中央（党中央、国务院及并列机关）") return "中央";
  if(n.n==="工会系统（中华全国总工会）") return "工会系统";
  const p=parents.get(n);
  if(n.c==="工会系统"){
    if(n.l==="省") return "工会系统·"+n.n;                 // 省工会节点
    if(p && p.l==="省") return "工会系统·"+p.n;            // 市工会节点→省级规则
    return "工会系统·"+n.n;                                // 全总/组节点
  }
  if(n.n.startsWith("专门委员会") && p) return p.n+"·"+n.n;
  if(n.c==="并列机关" && p) return p.n+"·"+n.n;          // 省级并列机关组
  if(n.c==="厅局" && p) return p.n+"·"+n.n;               // 省政府部门（厅局）组
  if(n.c==="群团组织" && p && p.l!=="中央") return p.n+"·"+n.n;   // 省级群团组织组
  if(n.k==="群团组织" && p && p.c==="群团组织" && p.l!=="中央"){
    const prov=parents.get(p);
    return (prov?prov.n:"")+"·"+n.n;                       // 省级群团成员
  }
  if(n.k==="群团组织" && p && p.l==="市") return p.n+"·"+n.n;  // 市总工会节点
  if(n.k==="并列机关" && p && p.c==="并列机关"){
    const prov=parents.get(p);
    return (prov?prov.n:"")+"·"+n.n;                       // 省级并列机关成员
  }
  if(n.cd && (n.l==="县"||n.l==="地级区")) return n.cd;    // 县/地级区节点自身（键=区划代码）
  if(TIAO_SYS.includes(n.c) && p && TIAO_SYS.includes(p.c) && n.l!=="条")
    return p.n+"·"+n.n;                                    // 条系统成员→组·成员
  return n.n.replace(/(省|市|特别行政区)$/,"").replace(/(壮族|回族|维吾尔)?自治区$/,"");
}

/* 树图模式: 以节点 n 名为根打开子图 */
async function openVizAt(nodeName){
  dispMode="viz";
  document.querySelectorAll("#dispSwitch .viewbtn").forEach(x=>x.classList.remove("active"));
  document.querySelector('#dispSwitch [data-disp="viz"]').classList.add("active");
  listBox.style.display="none";
  document.getElementById("mapWrapOuter").style.display="none";
  vizWrap.style.display="block";
  const kind=viewMode==="条"?"tiao":"blk";
  loadVizData(kind);
  if(!window.TreeViz){
    const s=document.createElement("script");
    s.src="tree_view.js?v=20261116";
    document.head.appendChild(s);
  }
  const t=setInterval(()=>{
    if(!window.TreeViz)return;
    const data=window[kind==="tiao"?"__TIAO__":"__TREE__"];
    if(!data)return;
    clearInterval(t);
    function find(n){if(n.n===nodeName)return n;for(const k of n.ks||[]){const f=find(k);if(f)return f}return null}
    // 条系统名 → viz 树节点名映射（列表「人大系统(33)」在树图里是「全国人民代表大会」等）
    const ALIAS=[["人大系统","全国人民代表大会"],["政协系统","中国人民政治协商会议全国委员会"],
      ["法院系统","最高人民法院"],["检察院系统","最高人民检察院"],["纪委系统","国家监察委员会"],
      ["财经系统","中央财经委员会办公室"],["外交系统","外交系统（外交部体系）"],
      ["群团组织系统","群团组织系统"],["垂直管理系统","国务院垂直管理系统"]];
    let node=find(data);
    if(!node){
      for(const [k,v] of ALIAS){
        if(nodeName.startsWith(k)){
          node=find(data,v);break;
        }
      }
    }
    if(!node){   // 别名仍不中: 按「去系统后缀」模糊匹配
      const stem=nodeName.replace(/系统（.*|系统$/,"");
      if(stem.length>=2)node=findByStem(data,stem);
    }
    function findByStem(n,stem){
      if(n.n.includes(stem))return n;
      for(const k of n.ks||[]){const f=findByStem(k,stem);if(f)return f}
      return null;
    }
    node=node||data;
    if(window.__VIZ_KIND__===kind){TreeViz.setTree(data)}else{window.__VIZ_KIND__=kind;TreeViz.mount(vizBox,data)}
    TreeViz.setRoot(node);
  },80);
  setTimeout(()=>clearInterval(t),6000);
}

/* ---------- JSON 树查看器 ---------- */
function jsonStats(obj){
  let nodes=0, entities=0, ok=0;
  (function walk(v){
    nodes++;
    if(v && typeof v==="object"){
      if(!v.ks || v.k!=="分组"){ entities++; if(v.x) ok++; }
      Object.values(v).forEach(walk);
    }
  })(obj);
  return {nodes, entities, ok, kb:(JSON.stringify(obj).length/1024).toFixed(0)};
}
function jsonNode(key, val, depth){
  const isObj=val && typeof val==="object";
  if(!isObj){
    const row=document.createElement("div"); row.className="jrow";
    const k=document.createElement("span"); k.className="jkey"; k.textContent=key+": ";
    const v=document.createElement("span");
    if(typeof val==="string"){ v.className="jstr"; v.textContent=JSON.stringify(val); }
    else if(typeof val==="number"){ v.className="jnum"; v.textContent=String(val); }
    else if(typeof val==="boolean"){ v.className="jbool"; v.textContent=String(val); }
    else { v.className="jnull"; v.textContent=String(val); }
    row.append(k,v);
    return row;
  }
  const arr=Array.isArray(val);
  const det=document.createElement("details"); det.className="jnode";
  const sum=document.createElement("summary");
  const tw=document.createElement("span"); tw.className="tw"; tw.textContent="▶";
  const k=document.createElement("span"); k.className="jkey"; k.textContent=key;
  const t=document.createElement("span"); t.className="jt"; t.textContent=arr?"[…]":"{…}";
  const cnt=document.createElement("span"); cnt.className="jcnt";
  cnt.textContent=arr? val.length : Object.keys(val).length;
  sum.append(tw,k,t,cnt);
  det.append(sum);
  const box=document.createElement("div"); box.className="children";
  let rendered=false;
  det.append(box);
  det.addEventListener("toggle",()=>{
    if(!det.open||rendered) return;
    rendered=true;
    if(arr){
      val.forEach((item,i)=>box.append(jsonNode(String(i), item, depth+1)));
    }else{
      Object.entries(val).forEach(([kk,vv])=>box.append(jsonNode(kk, vv, depth+1)));
    }
  });
  if(depth===0){ det.open=true; det.dispatchEvent(new Event("toggle")); }
  return det;
}

/* ---------- Python 语法高亮 ---------- */
const PY_BI=new Set("print len range str int float bool list dict set tuple enumerate sorted reversed zip map filter open input sum min max abs round isinstance type repr super Exception ValueError TypeError RuntimeError object bytes any all next iter json requests re socket time json".split(" "));
function pyCode(code){
  const E=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const re=/^(#.*)|('{3}[\s\S]*?'{3}|"{3}[\s\S]*?"{3}|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|((?:^|\n)\s*@\w+)|(\b\d+(?:\.\d+)?\b)|((?:^|\n)[ \t]*(?:def|class)[ \t]+)(\w+)|(\b(?:and|as|assert|async|await|break|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|nonlocal|not|or|pass|raise|return|try|while|with|yield|None|True|False)\b)|(\b[A-Za-z_]\w*\b)/gm;
  let out="", last=0, m;
  while((m=re.exec(code))){
    out+=E(code.slice(last,m.index));
    const t=m[0];
    if(m[1]!==undefined) out+=`<span class="jcom">${E(t)}</span>`;
    else if(m[2]!==undefined) out+=`<span class="jstr">${E(t)}</span>`;
    else if(m[3]!==undefined) out+=`<span class="jdec">${E(t)}</span>`;
    else if(m[4]!==undefined) out+=`<span class="jnum">${E(t)}</span>`;
    else if(m[5]!==undefined) out+=`<span class="jkwd">${E(m[5])}</span><span class="jdef">${E(m[6])}</span>`;
    else if(m[7]!==undefined) out+=`<span class="jkwd">${E(t)}</span>`;
    else if(PY_BI.has(m[8])) out+=`<span class="jbuilt">${E(t)}</span>`;
    else out+=E(t);
    last=m.index+t.length;
  }
  out+=E(code.slice(last));
  return out;
}

// ── 书签/分享: URL hash 深链（#块/list · #条/viz · #map/四川省/凉山?t=fy）──
function tmplSyncHash(){
  try{
    if(dispMode==="map"){
      if(window.MapViz&&window.__mapMounted){
        const ri=MapViz.regionInfo(),t=MapViz.getType();
        const h="#map"+(ri.prov?"/"+ri.prov:"")+(ri.city?"/"+ri.city:"")+(t&&t!=="all"?"?t="+t:"");
        if(location.hash!==h)history.replaceState(null,"",h);
        return;
      }
      // 地图尚未挂载完成: 保留传入的书签深链(#map/省/市), 仅把非 map 形态归一
      if(!/^#map(?:\/|\?|$)/.test(location.hash))history.replaceState(null,"","#map");
      return;
    }
    const v=viewMode==="条"?"条":"块";
    const h="#"+v+"/"+dispMode;
    if(location.hash!==h)history.replaceState(null,"",h);
  }catch(e){}
}
function tmplApplyHash(){
  const raw=location.hash.replace(/^#\/?/,"");
  if(!raw)return;
  const qi=raw.indexOf("?");
  const parts=(qi>=0?raw.slice(0,qi):raw).split("/").filter(Boolean).map(decodeURIComponent);
  const tm=(qi>=0?raw.slice(qi+1):"").match(/t=(\w+)/);
  const mapForm=parts[0]==="map";                                // 新形态 #map/省/市
  const provIdx=mapForm?1:2, cityIdx=mapForm?2:3;                // 旧书签 #块/map/省/市 偏移 1
  const wait=()=>{
    if(!window.__GOV_DATA__)return setTimeout(wait,150);
    let disp=parts[1]||"list", view=parts[0];
    if(view==="map"){view="块";disp="map";}                      // 新形态 #map/...
    else if(parts[1]==="map"){disp="map";}                       // 旧书签 #块/map/...
    if(disp==="map"){
      const mb=document.querySelector('#viewSwitch .viewbtn[data-view="map"]');
      if(mb)mb.click();
      if(parts[provIdx]){
        const t2=setInterval(()=>{
          if(window.MapViz&&window.__mapMounted){
            clearInterval(t2);
            MapViz.goTo(parts[provIdx],parts[cityIdx],tm?tm[1]:null);
          }
        },200);
      }
      return;
    }
    if(view!=="条"&&view!=="块")return;
    if(viewMode!==view){
      const vb=document.querySelector('#viewSwitch .viewbtn[data-view="'+view+'"]');
      if(vb)vb.click();
    }
    const db=document.querySelector('#dispSwitch [data-disp="'+disp+'"]');
    if(db)db.click();
  };
  wait();
  __tmplLastApplied=location.hash;
}

      return `<td title="缺失 ${d.missing} / ${d.total}" style="text-align:right;padding:2.5px 4px;font-variant-numeric:tabular-nums;color:${colOf(p)};font-weight:${p>0?600:400}">${p}%</td>`;
    };
    usHtml+=`<table style="width:100%;border-collapse:collapse;font-size:11px;margin-top:2px">
      <thead><tr style="color:#94a3b8">
        <th style="text-align:left;padding:2px 4px;font-weight:500">系统</th>
        <th style="text-align:right;padding:2px 4px;font-weight:500">省</th>
        <th style="text-align:right;padding:2px 4px;font-weight:500">市</th>
        <th style="text-align:right;padding:2px 4px;font-weight:500">县</th>
        <th style="text-align:right;padding:2px 4px;font-weight:500">合计</th></tr></thead><tbody>`+
      us.systems.filter(s=>s.total&&s.total.total).map(s=>
        `<tr><td style="padding:2.5px 4px;color:#334155">${s.label}</td>${cell(s.levels["省"])}${cell(s.levels["市"])}${cell(s.levels["县"])}${cell(s.total)}</tr>`).join("")+
      `</tbody></table>`;
    usHtml+=`<div style="font-size:10.5px;color:#94a3b8;margin-top:5px">口径：块视图省级子树（32 个单位）；缺失=树中无官网（列名）。生成于 ${us.generated||""}</div>`;
  }
  let h=`<h3>📊 数据健康</h3>
  <div class="kpis">
    <div class="kpi"><div class="v">${q.registry_total.toLocaleString()}</div><div class="k">注册机构</div></div>
    <div class="kpi"><div class="v">${urlPct}%</div><div class="k">条系统覆盖率</div></div>
    <div class="kpi"><div class="v">${xx.with_column||0}</div><div class="k">信息公开专栏</div></div>
  </div>
  ${usHtml}
  <div class="sec">来源等级分布</div>
  <div class="stackbar">${lvSegs}</div><div class="legend">${lvLeg}</div>
  <div class="sec">URL 健康状态</div>
  <div class="stackbar">${stSegs}</div><div class="legend">${stLeg}</div>
  <div class="sec">信息公开专栏覆盖</div>
  <div class="donuts">
    <div class="donut">${donutSVG(xxPct,"#7c3aed",82,9)}<div class="cap">专栏覆盖率</div></div>
    <div class="donut">${donutSVG(urlPct,"#2563eb",82,9)}<div class="cap">官网覆盖率</div></div>
  </div>
  <div class="sec">条系统 URL 覆盖率（${sys.length} 系统）</div>
  ${rows}`;
  p.innerHTML=h;p.style.display='block';
}
</script>
</body>
</html>
